<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>Chatbot AI</h1>
      <p>NVIDIA Nemotron 3 Ultra</p>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="message bot">Halo! Ada yang bisa saya bantu?</div>
    </div>

    <form class="chat-input" id="chat-form">
      <input type="text" id="user-input" placeholder="Ketik pesan..." autocomplete="off" required />
      <button type="submit" id="send-btn">Kirim</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
